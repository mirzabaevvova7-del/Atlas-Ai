name: Build ATLAS AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check requested Android permissions
        run: |
          if grep -q 'android.permission.INTERNET\|android.permission.READ_CONTACTS\|android.permission.SEND_SMS\|android.permission.READ_SMS' app/src/main/AndroidManifest.xml; then
            echo "Unexpected sensitive permission found"
            exit 1
          fi
          echo "Permission check passed: no internet, contacts, or SMS access permission."
      - name: Build APK
        run: gradle assembleDebug
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: timur-v1.0.2
          name: Timur Android v1.0.2 (security review build)
          body: "Timur синов версияси. Manifest рухсатлари чекланган, очиқ матнли HTTP трафик ўчирилган. Debug signing; Google Play Protect тасдиғи эмас."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
